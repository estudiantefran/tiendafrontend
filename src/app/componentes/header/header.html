<header class="header">

  <div class="header-container">

    <!-- LOGO Y MARCA -->
    <div class="brand">

      <a routerLink="/" class="logo">
        <span>🍫</span>
      </a>

      <div class="brand-text">
        <h1>PILAR DE ORO</h1>
        <p>Chocolate Artesanal</p>
      </div>

    </div>


    <!-- BUSCADOR -->
    <div class="header-actions">

      <div class="search-box">
        <input
          type="text"
          placeholder="Buscar productos..."
          [(ngModel)]="terminoBusqueda"
          (keyup.enter)="buscar()"
        />

        <span class="search-icon" (click)="buscar()">⌕</span>
      </div>


      <!-- CUENTA -->
      @if (authService.estaLogueado()) {

        @if (authService.esAdmin()) {
          <div class="admin-menu">
            <button class="account-btn">Admin ▾</button>
            <div class="admin-menu-dropdown">
              <a routerLink="/admin/categorias">Categorías</a>
              <a routerLink="/admin/productos">Productos</a>
              <a routerLink="/admin/pedidos">Pedidos</a>
            </div>
          </div>
        }

        <button class="account-btn" [routerLink]="['/mis-pedidos']">
          <span>{{ authService.usuarioActual()?.nombre }}</span>
        </button>
        <button class="account-btn" (click)="cerrarSesion()">
          <span>Salir</span>
        </button>
      } @else {
        <button class="account-btn" [routerLink]="['/login']">
          <span>Mi cuenta</span>
        </button>
      }


      <!-- CARRITO -->
      <button class="cart-btn" [routerLink]="['/carrito']">

        <span>Carrito</span>

        <span class="cart-count">
          {{ cartService.cantidadTotal() }}
        </span>

      </button>

    </div>

  </div>

</header>
